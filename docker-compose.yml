services:
  db:
    image: postgres:17
    container_name: tot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trade_of_titans
      POSTGRES_USER: tot
      POSTGRES_PASSWORD: tot_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: